<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunelle Ritual</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HERO -->

    <section class="hero">

        <div class="hero-glow"></div>

        <div class="hero-content">

            <img
                src="images/logo/logonew.png"
                alt="Lunelle Ritual Logo"
                class="logo"
            >

            <p class="subtitle">

                Welcome to your ritual.

            </p>

            <button class="ritual-button">

                Begin Your Ritual

            </button>

        </div>

    </section>

    <!-- RITUAL SELECTION -->

    <section id="ritual-selection">

        <h2>Choose Your Ritual</h2>

        <p class="ritual-text">

            Choose the rhythm that feels right today.

        </p>

        <div class="ritual-card">

            Quick Ritual

        </div>

        <div class="ritual-card">

            Classic Ritual

        </div>

        <div class="ritual-card">

            Deep Ritual

        </div>

    </section>

    <script src="js/main.js"></script>

</body>

</html>
