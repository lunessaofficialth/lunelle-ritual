<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunelle Ritual</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HERO -->

    <section class="hero">

        <div class="hero-glow"></div>

        <div class="hero-content">

            <img
                src="images/logo/logonew2.png"
                alt="Lunelle Ritual Logo"
                class="logo"
            >

            <p class="subtitle">

                Welcome to your ritual.

            </p>

            <button class="ritual-button" id="begin-ritual">
            Begin Your Ritual
            </button>

        </div>

    </section>

    <!-- RITUAL SELECTION -->

    <section id="ritual-selection">
<!-- CHOOSE YOUR RITUAL -->

<section id="ritual-selection">

    <div class="section-container">

        <h2>Choose Your Ritual</h2>

        <p class="ritual-text">

            Choose the rhythm that feels right today.

        </p>

        <div class="ritual-card">

            <h3>Quick Ritual</h3>

            <p>
                For a gentle pause.
            </p>

        </div>

        <div class="ritual-card">

            <h3>Classic Ritual</h3>

            <p>
                For everyday restoration.
            </p>

        </div>

        <div class="ritual-card">

            <h3>Deep Ritual</h3>

            <p>
                When you need to truly let go.
            </p>

        </div>

    </div>

</section>

    <script src="js/main.js"></script>

</body>

</html>
